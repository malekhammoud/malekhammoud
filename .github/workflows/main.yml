name: Programmatic SEO Drip Deploy

# 1. The Triggers
on:
  schedule:
    # Runs automatically at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: 
    # Allows you to click a "Run Workflow" button manually in GitHub if you want to test it

# 2. Granting Permissions
permissions:
  contents: write # Required so the bot can commit and push code back to your repo

jobs:
  deploy-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Fast checkout

      - name: Move Batch from _stash to src/app/software
        run: |
          # The exact number of pages to deploy per day. Start at 50 for the "Trust Phase".
          BATCH_SIZE=2
          
          # Check if _stash exists and has files
          if [ ! -d "_stash" ] || [ -z "$(ls -A _stash 2>/dev/null)" ]; then
            echo "Stash is empty. Deployment complete!"
            exit 0
          fi

          echo "Preparing to move $BATCH_SIZE folders..."
          mkdir -p src/app/software

          # List directories in _stash, take the top $BATCH_SIZE, and move them
          ls -d _stash/*/ 2>/dev/null | head -n $BATCH_SIZE | xargs -I {} mv {} src/app/software/
          
          echo "Successfully moved batch to src/app/software"

      - name: Commit and Push to Main
        run: |
          # Configure the GitHub Action Bot
          git config --global user.name "SEO Drip Bot"
          git config --global user.email "actions@github.com"
          
          # Stage the moved files and the deletions from _stash
          git add src/app/software/
          git add _stash/
          
          # Check if there are actually changes to commit
          if git diff-index --quiet HEAD --; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "seo: auto-deployed programmatic batch"
            git push origin main
            echo "Batch pushed successfully to Vercel."
          fi
