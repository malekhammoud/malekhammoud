name: Programmatic SEO Drip Deploy

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  deploy-batch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Smart Drip & Link Resolver
        run: node scripts/smart_deploy.mjs

      - name: Commit and Push to Main
        run: |
          git config --global user.name "SEO Drip Bot"
          git config --global user.email "actions@github.com"
          
          git add src/app/software/
          git add _stash/
          
          if git diff-index --quiet HEAD --; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "seo: auto-deployed batch and resolved internal links"
            git push origin main
            echo "Batch pushed successfully to Vercel."
          fi
